<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홍인 art class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c8a060;--gold2:#e2c47a;--bg:#08060a;--card:#100e14;--text:#e8d9b8;--muted:#8a7a5a}
body{background:var(--bg);color:var(--text);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;overflow-x:hidden}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

.wrap{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* 헤더 */
header{text-align:center;padding:72px 20px 48px}
.year{font-size:.7rem;letter-spacing:.4em;color:var(--gold);margin-bottom:20px}
h1{font-family:"Gowun Batang",serif;font-size:clamp(1.5rem,5vw,2.8rem);letter-spacing:.08em;line-height:1.5;margin-bottom:0}
.hl{width:60px;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:28px auto 0}

/* 그리드 */
main{flex:1;max-width:900px;margin:0 auto;padding:52px 20px 72px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px}

/* 카드 */
.card{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;
  background:linear-gradient(145deg,#120f17,#0d0b12);
  border:1px solid #c8a06028;border-radius:16px;
  padding:36px 20px 28px;gap:16px;
  transition:transform .3s,box-shadow .3s,border-color .3s;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#c8a06014 0%,transparent 70%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 56px #c8a06018;border-color:#c8a06055}
.card:hover::after{opacity:1}

.icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#1a1620,#231d2a);
  border:1px solid #c8a06035;display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;line-height:1;flex-shrink:0;transition:border-color .3s,box-shadow .3s}
.card:hover .icon{border-color:#c8a06077;box-shadow:0 0 24px #c8a06022}

.card-body{text-align:center}
.tag{display:inline-block;font-size:.62rem;letter-spacing:.25em;color:var(--gold);border:1px solid #c8a06044;padding:2px 8px;border-radius:20px;margin-bottom:10px}
.tag.game{color:#a0c8a0;border-color:#a0c8a044}
.card-title{font-family:"Gowun Batang",serif;font-size:1.05rem;font-weight:700;line-height:1.4;margin-bottom:6px}
.card-desc{font-size:.78rem;color:var(--muted);line-height:1.65}

.arrow{position:absolute;bottom:14px;right:18px;color:#c8a06040;font-size:.9rem;transition:color .3s,transform .3s}
.card:hover .arrow{color:var(--gold);transform:translateX(4px)}

/* 푸터 */
footer{text-align:center;padding:28px 20px;border-top:1px solid #c8a06018;font-size:.7rem;color:var(--muted);letter-spacing:.15em}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <header>
    <div class="year">2026학년도 · MAETAN MIDDLE SCHOOL</div>
    <h1>홍인<br>art class</h1>
    <div class="hl"></div>
  </header>

  <main>
    <div class="grid">

      <a class="card" href="1학년_전시장 (2).html">
        <div class="icon">🏛️</div>
        <div class="card-body">
          <div class="tag">GALLERY</div>
          <div class="card-title">1학년 전시관</div>
          <div class="card-desc">3D 가상 공간에서 학생 작품을 감상해요</div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="card" href="maetan_gallery.html">
        <div class="icon">🎨</div>
        <div class="card-body">
          <div class="tag">GALLERY</div>
          <div class="card-title">매탄 갤러리</div>
          <div class="card-desc">매탄중학교 대표 갤러리 전시실</div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="card" href="jeontong_munyang.html">
        <div class="icon">🏺</div>
        <div class="card-body">
          <div class="tag">MAKE</div>
          <div class="card-title">전통문양 도안</div>
          <div class="card-desc">패턴 만들기 · 사진 도안 · 병 작품 · 문양 카드</div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="card" href="games.html">
        <div class="icon">🎮</div>
        <div class="card-body">
          <div class="tag game">GAME</div>
          <div class="card-title">미술 게임</div>
          <div class="card-desc">팝아트 스타일로 즐기는 미술 게임</div>
        </div>
        <span class="arrow">→</span>
      </a>

    </div>
  </main>

  <footer>© 2026 홍인 art class · Maetan Middle School Art</footer>
</div>

<script>
const cv=document.getElementById('bg'),x=cv.getContext('2d');
function resize(){cv.width=innerWidth;cv.height=innerHeight}
resize(); window.addEventListener('resize',resize);
const pts=Array.from({length:55},()=>({
  x:Math.random()*cv.width, y:Math.random()*cv.height,
  r:Math.random()*1.3+.3,
  vx:(Math.random()-.5)*.22, vy:(Math.random()-.5)*.22,
  a:Math.random()*.4+.07
}));
(function tick(){
  x.clearRect(0,0,cv.width,cv.height);
  pts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>cv.width) p.vx*=-1;
    if(p.y<0||p.y>cv.height) p.vy*=-1;
    x.beginPath(); x.arc(p.x,p.y,p.r,0,Math.PI*2);
    x.fillStyle=`rgba(200,160,96,${p.a})`; x.fill();
  });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
